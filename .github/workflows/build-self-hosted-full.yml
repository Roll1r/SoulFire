name: Build Self-Hosted Full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-build:
    runs-on: self-hosted
    timeout-minutes: 360

    env:
      GRADLE_OPTS: -Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install base tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip cmake ninja-build pkg-config curl
          python3 --version
          cmake --version
          ninja --version

      - name: Build Vulkan runtime
        run: |
          python3 scripts/build-vulkan-runtime.py --jobs "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Execute full Gradle build
        run: ./gradlew build test printSFCLIFlags --stacktrace

      - name: Get version
        id: get-version
        run: |
          projectVersion=$(grep '^maven_version=' gradle.properties | cut -d'=' -f2)
          echo "version=$projectVersion" >> $GITHUB_OUTPUT

      - name: Upload Client Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SoulFireCLI
          if-no-files-found: error
          path: |
            client-launcher/build/libs/SoulFireCLI-${{ steps.get-version.outputs.version }}.jar

      - name: Upload Dedicated Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SoulFireDedicated
          if-no-files-found: error
          path: |
            dedicated-launcher/build/libs/SoulFireDedicated-${{ steps.get-version.outputs.version }}.jar
